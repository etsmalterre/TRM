<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover: the installed app paints its own navy band behind the
      status bar, so it owns the safe-area insets.
      user-scalable=no: a wall tablet nobody is meant to pinch — an accidental
      zoom would leave the floor plan cropped until someone notices.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#143D6B" />
    <meta name="description" content="TRS Atelier - le TRS des métiers de Tricotage Malterre" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>TRS Atelier</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
